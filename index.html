<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#14271f">
  <meta name="description" content="天下布魔潛力素材三線生產規劃與手機通知提醒">
  <title>潛力工坊｜生產規劃</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <div class="work-grid">
      <section class="panel demand-panel">
        <div class="section-heading"><div><h2>設定需求</h2></div><button id="exampleBtn" class="text-btn">載入範例</button></div>
        <div id="demandGroups" class="demand-groups"></div>
        <div class="demand-footer"><span id="demandSummary">尚未設定需求</span><button id="clearBtn" class="text-btn subtle">清除全部</button></div>
      </section>
      <section class="panel plan-panel">
        <div class="section-heading plan-heading"><div><h2>生產流程</h2></div><span id="operationBadge" class="operation-badge">尚未排程</span></div>
        <div id="planSummary" class="plan-summary">設定素材需求後，開始規劃生產流程。</div>
        <div id="searchProgress" class="search-progress" role="status" aria-live="polite" hidden><div class="search-progress-track" role="progressbar" aria-label="排程頂層分支搜尋進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="searchProgressBar"></span></div><span id="searchProgressText"></span></div>
        <div id="lanes" class="lanes" aria-label="生產流程項目"></div>
        <div id="emptyPlan" class="empty-plan"><span class="empty-icon">↗</span><span>你的生產計畫會出現在這裡</span></div>
        <div class="run-area"><div id="timerDock" class="timer-dock" role="status" aria-live="polite" hidden><div class="timer-left"><span class="timer-pulse"></span><span id="timerLabel">目前項目倒數</span></div><strong id="timerValue">00:00</strong><button id="stopBtn" class="stop-btn" aria-label="停止並清除倒數">停止</button></div><label class="vibrate-toggle"><input id="vibrateToggle" type="checkbox" checked><span>提醒時震動</span></label><button id="runBtn" class="run-btn" disabled><span>生產此項</span><span class="btn-arrow">↗</span></button></div>
      </section>
    </div>
  </main>
  <script src="productionScheduler.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
